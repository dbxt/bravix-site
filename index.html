<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bravix Edits</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff 0%, #aaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    p {
      color: #888;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .cta {
      display: inline-block;
      background: #ff0000;
      color: #fff;
      padding: 0.85rem 2rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
    }
    .cta:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bravix Edits</h1>
    <p>Video edits. Coming at you.</p>
    <a class="cta" href="https://www.youtube.com/@BravixEdits" target="_blank" rel="noopener">
      Watch on YouTube
    </a>
  </div>
</body>
</html>
