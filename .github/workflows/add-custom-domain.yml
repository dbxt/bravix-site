name: Add Custom Domain to CF Pages

on:
  workflow_dispatch:

jobs:
  add-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Add bravixedits.com to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          account_id = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          project = 'bravix-edits'
          domain = 'bravixedits.com'

          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{project}/domains'

          # Check if already exists
          try:
              with urlopen(Request(url, headers=headers), timeout=30) as r:
                  existing = json.loads(r.read())
              domains = [d['name'] for d in existing.get('result', [])]
              if domain in domains:
                  print(f'{domain} already added.')
                  exit(0)
          except Exception as e:
              print(f'List check: {e}')

          # Add domain
          payload = json.dumps({'name': domain}).encode()
          try:
              with urlopen(Request(url, data=payload, headers=headers, method='POST'), timeout=30) as r:
                  result = json.loads(r.read())
              print(f'Added: {json.dumps(result, indent=2)}')
          except HTTPError as e:
              body = e.read().decode()
              print(f'Error {e.code}: {body}')
              exit(1)
          PY
