name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bravix-site-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CF_PROJECT: bravix-edits

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ env.CF_PROJECT }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          account_id = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          project_name = os.environ['PROJECT_NAME']
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          project_url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{project_name}'
          create_url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects'

          try:
              with urlopen(Request(project_url, headers=headers), timeout=30) as r:
                  r.read()
              print(f'Pages project {project_name!r} already exists.')
          except HTTPError as e:
              if e.code != 404:
                  raise
              payload = json.dumps({'name': project_name, 'production_branch': 'main'}).encode()
              with urlopen(Request(create_url, data=payload, headers=headers, method='POST'), timeout=30) as r:
                  r.read()
              print(f'Created Pages project {project_name!r}.')
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name="${{ env.CF_PROJECT }}"
            --branch="main"
