name: Add DNS CNAME for bravixedits.com

on:
  workflow_dispatch:

jobs:
  add-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Create CNAME record and check Pages domain status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          token = os.environ['CLOUDFLARE_API_TOKEN']
          zone_id = '5af9e7b5bb0da2d76473cd198d461d5c'
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          # List existing DNS records
          url = f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?name=bravixedits.com'
          with urlopen(Request(url, headers=headers), timeout=30) as r:
              existing = json.loads(r.read())
          print('Existing records:', json.dumps(existing.get('result', []), indent=2))

          records = existing.get('result', [])
          root_records = [r for r in records if r['name'] == 'bravixedits.com']

          if root_records:
              print('DNS record already exists, no action needed.')
          else:
              # Create CNAME @ -> bravix-edits.pages.dev (proxied)
              create_url = f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records'
              payload = json.dumps({
                  'type': 'CNAME',
                  'name': 'bravixedits.com',
                  'content': 'bravix-edits.pages.dev',
                  'proxied': True,
                  'comment': 'Cloudflare Pages - bravix-edits'
              }).encode()
              try:
                  with urlopen(Request(create_url, data=payload, headers=headers, method='POST'), timeout=30) as r:
                      result = json.loads(r.read())
                  print('Created:', json.dumps(result, indent=2))
              except HTTPError as e:
                  print(f'Error {e.code}: {e.read().decode()}')
                  exit(1)
          PY
